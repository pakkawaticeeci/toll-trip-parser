:root{
  --navy:#0f172a;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;
  --indigo:#4f46e5;--indigo-light:#eef2ff;--indigo-border:#c7d2fe;

*{box-sizing:border-box}
body{

button,input,textarea,select{font:inherit}
button{

button:hover:not(:disabled){background:#f8fafc;border-color:#94a3b8;transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,23,42,0.08)}

button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #4f46e5;outline-offset:2px}

/* Sub-Header Toolbar */
.toolbar{
  background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(226,232,240,0.8);position:sticky;top:0;z-index:5;
  box-shadow:0 4px 20px rgba(15,23,42,0.04);
}
.toolbar-inner{
  max-width:1540px;margin:auto;padding:12px 28px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}
.tool-title{display:flex;align-items:center;gap:12px}
.tool-badge{
  background:linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);color:#fff;border:none;
  font-size:11.5px;font-weight:800;padding:4px 12px;border-radius:999px;
  box-shadow:0 2px 8px rgba(79, 70, 229, 0.28);
}
.tool-title h1{font-size:16.5px;margin:0;color:var(--navy);font-weight:800}
.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.toggle{

}
.toggle:hover{background:#fff;border-color:#94a3b8}
.toggle input{accent-color:var(--green);width:15px;height:15px;cursor:pointer}

main{max-width:1540px;margin:22px auto;padding:0 28px 48px;display:grid;gap:22px}
.work{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,2.2fr);gap:22px}
.panel{

}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}

}

.status{font-size:12px;font-weight:800;padding:5px 14px;border-radius:999px;background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}
.status.ok{background:#d1fae5;color:#065f46;border-color:#6ee7b7}
.status.warn{background:#fef3c7;color:#92400e;border-color:#fcd34d}

/* Mode Selector */
.modebar{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;
  margin:0 0 18px;padding:6px;background:#f1f5f9;border-radius:999px;border:1px solid #e2e8f0;
}
.modebar button{

}
.modebar button:hover{color:var(--navy);background:rgba(255,255,255,0.7);transform:none}
.modebar button[aria-pressed=&quot;true&quot;]{
  background:linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);color:#fff;
  box-shadow:0 4px 12px rgba(79,70,229,0.3);
}

/* Fields Grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.field{
  background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:12px 14px;
  min-width:0;transition:all 0.2s ease;
}
.field:hover{border-color:#cbd5e1;transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,42,0.03)}
.field.key{background:linear-gradient(145deg, #eef2ff 0%, #e0e7ff 100%);border-color:#c7d2fe}
.field.green{background:linear-gradient(145deg, #ecfdf5 0%, #d1fae5 100%);border-color:#a7f3d0}
.field.amber{background:linear-gradient(145deg, #fffbeb 0%, #fef3c7 100%);border-color:#fde68a}
.field.blank{background:#f1f5f9;opacity:0.7}
.field label{font-size:12px;font-weight:800;display:block;min-width:0;color:#334155}
.labelrow{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:8px}
.mini{

.history-list{max-height:300px;overflow:auto;padding-right:4px}
.history-row{

.history-row:hover{background:#fff;border-color:#cbd5e1;box-shadow:0 4px 12px rgba(15,23,42,0.04)}
.history-row .desc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.history-row .desc strong{color:var(--indigo);font-size:13.5px}
.history-row .desc span:last-child{white-space:pre-line}
.history-row .actions{display:flex;gap:8px}
.history-row button{font-size:12px;padding:7px 14px;border-radius:999px}
.green-btn{background:linear-gradient(135deg, #10b981 0%, #059669 100%);color:#fff;border:none}
.green-btn:hover{background:linear-gradient(135deg, #059669 0%, #047857 100%)}
.danger-text{color:#be123c;background:#fff1f2;border-color:#fecdd3}
.danger-text:hover:not(:disabled){background:#ffe4e6}

.toast{
  position:fixed;right:24px;bottom:24px;z-index:99;max-width:calc(100vw - 48px);
  background:rgba(15,23,42,0.95);backdrop-filter:blur(8px);color:#fff;padding:13px 22px;border-radius:999px;font-weight:700;
  box-shadow:0 12px 30px rgba(0,0,0,0.25);display:none;border:1px solid rgba(16,185,129,0.5);
}
.toast.show{display:block;animation:slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1)}
.toast.error{background:rgba(136,19,55,0.95);border-color:rgba(251,113,133,0.5)}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}
kbd{font:11.5px Consolas,monospace;border:1px solid #cbd5e1;border-radius:6px;padding:2px 6px;background:#fff;color:#334155;box-shadow:0 1px 2px rgba(0,0,0,0.06)}
.small-footer{font-size:11.5px;color:var(--muted);text-align:center;padding-top:6px}

@media(max-width:1050px){.work{grid-template-columns:1fr}.paste textarea{min-height:160px}
@media(max-width:650px){
  main{padding:0 14px 28px;margin-top:14px}

  .modebar{grid-template-columns:1fr;border-radius:20px}
  .panel{padding:16px;border-radius:20px}
  .copy-main{font-size:15px}
}

.quick button:hover{background:#a7f3d0}
.refhint{font-size:11px;color:#4f46e5;font-weight:700;display:block;margin-top:6px}

.info{margin-top:14px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.notice{
  display:none;background:#fffbeb;border:1px solid #fcd34d;border-left:5px solid #f59e0b;
  color:#92400e;padding:12px 16px;border-radius:16px;margin:14px 0 0;font-size:12.5px;font-weight:600;
}
.notice.show{display:block}

/* Main Copy CTA */
.copy-main{
  background:linear-gradient(135deg, #10b981 0%, #059669 100%);
  color:#fff;border:none;border-radius:999px;padding:17px 28px;
  font-size:17.5px;font-weight:800;letter-spacing:0.3px;
  box-shadow:0 10px 25px rgba(5,150,105,0.32);
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.copy-main:hover:not(:disabled){
  background:linear-gradient(135deg, #059669 0%, #047857 100%);
  box-shadow:0 12px 30px rgba(5,150,105,0.42);transform:translateY(-2px);
}

/* Table */
.tablewrap{overflow:auto;border-radius:18px;border:1px solid #cbd5e1;background:#fff;box-shadow:inset 0 1px 3px rgba(0,0,0,0.02)}
table{border-collapse:collapse;width:100%;min-width:2150px;text-align:left}
th{
  background:#1e293b;color:#f8fafc;font-size:12px;font-weight:700;
  padding:12px 14px;border-right:1px solid #334155;white-space:nowrap;
}
td{padding:7px;border-right:1px solid #e2e8f0;background:#fff}
td input,td select,td textarea{
  border:1px solid transparent;background:transparent;border-radius:10px;
  padding:8px 10px;width:100%;min-width:85px;color:var(--ink);font-size:13px;
}
td textarea{resize:vertical;line-height:1.45;min-height:48px}
td input:hover,td input:focus,td select:hover,td select:focus,td textarea:hover,td textarea:focus{border-color:#94a3b8;background:#f8fafc}
td input[readonly]{background:#f1f5f9;color:#64748b}
.empty{padding:32px;text-align:center;color:var(--muted);font-size:13px;background:#f8fafc;border-radius:16px;margin-top:10px}

/* History */
.history-list{max-height:300px;overflow:auto;padding-right:4px}
.history-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 16px;border:1px solid #e2e8f0;border-radius:18px;margin-top:10px;background:#f8fafc;
  transition:all 0.2s;
}
.history-row:hover{background:#fff;border-color:#cbd5e1;box-shadow:0 4px 12px rgba(15,23,42,0.04)}
.history-row .desc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.history-row .desc strong{color:var(--indigo);font-size:13.5px}
.history-row .desc span:last-child{white-space:pre-line}
.history-row .actions{display:flex;gap:8px}
.history-row button{font-size:12px;padding:7px 14px;border-radius:999px}
.green-btn{background:linear-gradient(135deg, #10b981 0%, #059669 100%);color:#fff;border:none}
.green-btn:hover{background:linear-gradient(135deg, #059669 0%, #047857 100%)}
.danger-text{color:#be123c;background:#fff1f2;border-color:#fecdd3}
.danger-text:hover:not(:disabled){background:#ffe4e6}

.toast{
  position:fixed;right:24px;bottom:24px;z-index:99;max-width:calc(100vw - 48px);
  background:rgba(15,23,42,0.95);backdrop-filter:blur(8px);color:#fff;padding:13px 22px;border-radius:999px;font-weight:700;
  box-shadow:0 12px 30px rgba(0,0,0,0.25);display:none;border:1px solid rgba(16,185,129,0.5);
}
.toast.show{display:block;animation:slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1)}
.toast.error{background:rgba(136,19,55,0.95);border-color:rgba(251,113,133,0.5)}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}
kbd{font:11.5px Consolas,monospace;border:1px solid #cbd5e1;border-radius:6px;padding:2px 6px;background:#fff;color:#334155;box-shadow:0 1px 2px rgba(0,0,0,0.06)}
.small-footer{font-size:11.5px;color:var(--muted);text-align:center;padding-top:6px}

@media(max-width:1050px){.work{grid-template-columns:1fr}.paste textarea{min-height:160px}
@media(max-width:650px){
  main{padding:0 14px 28px;margin-top:14px}

  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modebar{grid-template-columns:1fr;border-radius:20px}
  .panel{padding:16px;border-radius:20px}
  .copy-main{font-size:15px}
}

  });

  tabs[1].tabIndex = -1;

  window.addEventListener('paste', e => {
    const s = e.clipboardData?.getData('text/plain');
    if (!s?.trim()) return;
    const w = frames[selected].contentWindow;
    try {
      e.preventDefault();
      w.document.getElementById('raw').value = s;
      w.process(s, { auto: true });
    } catch {}
  });
</script>
</body>
</html>
